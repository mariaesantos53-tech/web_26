<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>formulário</title>
</head>
<body>

<h1>Pesquisa de satisfação do cliente</h1>

<form action="" method="post">

    <label>
        nome:
        <input name="form_nome" type="text" placeholder="digite seu nome" required>
    </label>
    <br>
    <br>


    <label>
        empresa:
        <input name="form_empresa" type="text" placeholder="digite o nome da empresa" required>
    </label>
    <br>
    <br>

    <label>idade </label>
    <br>

    <label>
        <input name="form_idade" value="1" type="radio">
        10 - 20 anos
    </label>

    <label>
        <input name="form_idade" value="2" type="radio">
        20 - 30 anos
    </label>


    <label>
        <input name="form_idade" value="3" type="radio">
        30 - 40 anos
    </label>


    <label>
        <input name="form_idade" value="4" type="radio">
        40 - 50 anos
    </label>


    <label>
        <input name="form_em" value="5" type="radio">
        50 - 80 anos
    </label>

    <br>
    <br>

    <label>
        Email:
        <input name="form_email" type="email" placeholder="Ex:digite seu email" required>
    </label>

    <br>
    <br>


    <label>
        telefone comercial:
        <input name="form_telefone" type="number" placeholder="18-9564" required>
    </label>

    <label>
        celular:
        <input name="form_celular" type="number" required>
    </label>
    <br>
    <br>


    <label>como você avalia os nossos serviços atualmente? </label>
    <br>

    <label>
        <input name="form_avalia" value="1" type="radio">
        regular
    </label>

    <label>
        <input name="form_avalia" value="2" type="radio">
        bom
    </label>


    <label>
        <input name="form_avalia" value="3" type="radio">
       excelente
    </label>


    <br>
    <br>


    <label>como você avalia os serviços da área operacional? </label>
    <br>

    <label>
        <input name="form_servicos" value="1" type="radio">
        regular
    </label>

    <label>
        <input name="form_servicos" value="2" type="radio">
        bom
    </label>


    <label>
        <input name="form_servicos" value="3" type="radio">
       excelente
    </label>


    <br>
    <br>

    <label>Qual o nível de satisfação com o atendimento administrativo quando você precisa? </label>
    <br>

    <label>
        <input name="form_nivel" value="1" type="radio">
        pouco satisfatório
    </label>

    <label>
        <input name="form_nivel" value="2" type="radio">
        satisfatório
    </label>


    <label>
        <input name="form_nivel" value="3" type="radio">
      muito satisfatório
    </label>


    <br>
    <br>
<label>os profissionais lhe atendem de forma satisfatória? </label>
    <br>

    <label>
        <input name="form_profissionais" value="1" type="radio">
        sim
    </label>

    <label>
        <input name="form_profissionais" value="2" type="radio">
       não
    </label>

    <br>
    <br>

<label>
         você tem alguma sugestão ou crítica a fazer para cada vez mais melhorarmos nossos serviços?<br>
        <textarea name="form_sugestao" rows="10" cols="50" placeholder="digite sua mensagem"></textarea>
    </label>

    <br>
    <br>

    <button type="submit">enviar</button>
    <button type="reset">limpar</button>

    <br>
    <br>
</body>
</html>
