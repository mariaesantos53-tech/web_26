<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>formulário</title>
</head>
<body>
<h2> formulário 1</h2>

<form action="" method="post">
    <label>
        nome:
        <input name="form_nome" type="text" placeholder="digite seu nome" required>
    </label>



    <br>
    <br>

    <label>
        Email:
        <input name="form_email" type="email" placeholder="Ex:digite seu email" required>
    </label>

    <br>
    <br>

    <label>
        assunto:
        <input name="form_assunto" type="text">
    </label>

    <br>
    <br>

    <label>
        mensagem:
        <textarea name="form_mensagem" rows="10" cols="50" placeholder="digite sua mensagem"></textarea>
    </label>

    <br>
    <br>


<!--    botao para enviar-->
<!--    sempre vai ser submit para salvar-->
    <button type="submit">enviar</button>
    <button type="reset">limpar</button>

    <br>
    <br>

















</body>
</html>
