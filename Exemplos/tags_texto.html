<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>tags de texto</title>
</head>
<body>

<h1> duda favaro </h1>
<h2> duda favaro </h2>
<h3> duda favaro </h3>
<h4> duda favaro </h4>
<h5> duda favaro </h5>
<h6> duda favaro </h6>

<!--o hr é para deixar uma linha horizontal-->
<hr>
<p>Este é um parágrafo</p>
<hr>

<p>
<!--o br serve para quebrar linha,como no exemplo abaixo-->
    primeira linha<br><br>
    segunda linha
</p>

<hr>

<h2>lista ordenada</h2>

<ol>
    <li>item1</li>
    <li>item2</li>
    <li>item3</li>
</ol>
<hr>
<h2>lista não ordenada</h2>


<ul>
    <li>item1</li>
    <li>item2</li>
    <li>item3</li>
</ul>

<a href="https://www.google.com" title="clique para saber mais">Google</a><br>
<a href="https://www.google.com" target="_blank">Google - nova aba</a>

<!--só se comporta como link se tiver Href-->

<!--para criar um comentario utiliza-se um atalho crtl + / -->
</body>
</html>
